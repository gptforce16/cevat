<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuyu Logu Oluşturucu</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        h1 { font-size: 28px; color: #8B0000; margin: 20px 0; text-align: center; }
        h2 { font-size: 22px; color: #8B0000; margin: 15px 0; }
        .container { display: flex; flex-direction: column; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .input-section, .output-section, .filters-section { border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        .layer-form { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; }
        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 8px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        .layer-item { display: flex; justify-content: space-between; padding: 10px; border: 1px solid #eee; margin-bottom: 5px; background-color: #f9f9f9; }
        .section-container { display: flex; margin-top: 20px; background-color: white; padding: 10px; border: 1px solid #000; position: relative; width: 350px; overflow: visible; }
        .section-legend { width: 120px; flex-shrink: 0; }
        .section-pattern { width: 100px; border-left: 1px solid #000; border-right: 1px solid #000; flex-shrink: 0; position: relative; }
        .section-well { width: 130px; position: relative; flex-shrink: 0; }
        .legend-item { position: absolute; width: 100%; text-align: center; padding: 0 5px; border-bottom: 1px dashed #ccc; font-size: 11px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .pattern-layer { width: 100%; position: absolute; left: 0; }
        .filter-zone, .casing-zone { position: absolute; left: 0; width: 100%; text-align: center; font-size: 9px; display: flex; align-items: center; justify-content: center; border: 1px solid #333; }
        .filter-zone { background-color: rgba(0,0,255,0.2); }
        .casing-zone { background-color: rgba(200,200,200,0.5); }
        .pattern-options { display: flex; gap: 5px; }
        .pattern-option { width: 40px; height: 40px; border: 1px solid #ddd; cursor: pointer; }
        .pattern-option.selected { border: 2px solid #4CAF50; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kuyu Logu Oluşturucu</h1>
        <div class="input-section">
            <h2>Katman Bilgileri</h2>
            <div class="layer-form">
                <div class="form-group"><label>Katman Adı</label><input type="text" id="layerName"></div>
                <div class="form-group"><label>Başlangıç (m)</label><input type="number" id="startDepth" min="0" step="0.1"></div>
                <div class="form-group"><label>Bitiş (m)</label><input type="number" id="endDepth" min="0" step="0.1"></div>
                <div class="form-group"><label>Desen</label><div class="pattern-options" id="patternOptions"></div></div>
                <button id="addLayerBtn">Katman Ekle</button>
            </div>
        </div>
        <div class="filters-section">
            <h2>Filtre Ayarları</h2>
            <div class="form-group"><label>Filtre Başlangıç Derinlikleri (virgülle ayırın, 4m uzunluğunda çizilir)</label><input type="text" id="filterDepths" placeholder="8, 16"></div>
        </div>
        <div class="input-section"><div class="layer-list" id="layerList"></div></div>
        <div class="output-section">
            <h2>Jeolojik Kesit</h2>
            <button id="generateSectionBtn">Kesit Oluştur</button>
            <div class="section-container" id="sectionContainer">
                <div class="section-legend" id="sectionLegend"></div>
                <div class="section-pattern" id="sectionPattern"></div>
                <div class="section-well" id="sectionWell"></div>
            </div>
            <button id="saveImageBtn" style="display:none; margin-top:10px;" class="save-btn">Görüntüyü Kaydet</button>
        </div>
    </div>

    <script>
        const patterns = [{color: "#d3d3d3", pattern: "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"6\" height=\"6\"><rect width=\"6\" height=\"6\" fill=\"%23d3d3d3\"/><circle cx=\"1\" cy=\"1\" r=\"0.7\" fill=\"%23696969\"/></svg>')"}, {color: "#8b4513", pattern: "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"8\" height=\"8\"><rect width=\"8\" height=\"8\" fill=\"rgba(139,69,19,0.4)\"/></svg>')"}, {color: "#0000cd", pattern: "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"8\" height=\"8\"><path d=\"M0 8 L8 0\" stroke=\"%230000cd\" stroke-width=\"2\"/></svg>')"}];
        let layers = [], selectedPatternIndex = 0;
        
        function createPatternOptions() {
            const container = document.getElementById('patternOptions');
            container.innerHTML = '';
            patterns.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `pattern-option ${i === selectedPatternIndex ? 'selected' : ''}`;
                div.style.backgroundImage = p.pattern;
                div.onclick = () => { selectedPatternIndex = i; createPatternOptions(); };
                container.appendChild(div);
            });
        }
        createPatternOptions();

        document.getElementById('addLayerBtn').onclick = () => {
            const name = document.getElementById('layerName').value, start = parseFloat(document.getElementById('startDepth').value), end = parseFloat(document.getElementById('endDepth').value);
            if (!name || isNaN(start) || isNaN(end) || end <= start) return alert("Hatalı veri");
            layers.push({name, start, end, pattern: patterns[selectedPatternIndex]});
            updateLayerList();
            document.getElementById('startDepth').value = end;
        };

        function updateLayerList() {
            const list = document.getElementById('layerList');
            list.innerHTML = '<h3>Katmanlar</h3>';
            layers.forEach((l, i) => list.innerHTML += `<div class="layer-item">${l.name} (${l.start}-${l.end}m) <button onclick="layers.splice(${i},1); updateLayerList();">Sil</button></div>`);
        }

        document.getElementById('generateSectionBtn').onclick = () => {
            layers.sort((a,b) => a.start - b.start);
            const legend = document.getElementById('sectionLegend'), pattern = document.getElementById('sectionPattern'), well = document.getElementById('sectionWell');
            legend.innerHTML = pattern.innerHTML = well.innerHTML = '';
            const scale = 8, totalDepth = layers[layers.length-1].end;
            [legend, pattern, well].forEach(el => el.style.height = `${totalDepth * scale}px`);
            
            const filters = document.getElementById('filterDepths').value.split(',').map(Number).filter(n => !isNaN(n));
            
            layers.forEach(l => {
                const h = (l.end - l.start) * scale, t = l.start * scale;
                legend.innerHTML += `<div class="legend-item" style="height:${h}px; top:${t}px">${l.name}<br>${l.start}-${l.end}m</div>`;
                pattern.innerHTML += `<div class="pattern-layer" style="height:${h}px; top:${t}px; background-image:${l.pattern.pattern}"></div>`;
            });

            let currentDepth = 0;
            filters.forEach(f => {
                if (f > currentDepth) well.innerHTML += `<div class="casing-zone" style="height:${(f-currentDepth)*scale}px; top:${currentDepth*scale}px">Kapalı<br>${currentDepth}-${f}m</div>`;
                well.innerHTML += `<div class="filter-zone" style="height:${4*scale}px; top:${f*scale}px">Filtre<br>${f}-${f+4}m</div>`;
                currentDepth = f + 4;
            });
            if (currentDepth < totalDepth) well.innerHTML += `<div class="casing-zone" style="height:${(totalDepth-currentDepth)*scale}px; top:${currentDepth*scale}px">Kapalı<br>${currentDepth}-${totalDepth}m</div>`;
            document.getElementById('saveImageBtn').style.display = 'block';
        };

        document.getElementById('saveImageBtn').onclick = () => {
            html2canvas(document.getElementById('sectionContainer'), {scale: 3}).then(c => {
                const link = document.createElement('a'); link.download = 'kuyu_logu.png'; link.href = c.toDataURL(); link.click();
            });
        };
    </script>
<p style="text-align:center; font-size:12px;">© 2025 | Emre Mermutlu</p>
</body>
</html>
